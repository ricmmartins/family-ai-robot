<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Segoe UI, Arial, sans-serif"><rect width="680" height="440" fill="white"/><text x="340" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">DESENHO EXPLICATIVO: NAO E CAPTURA DO SEU COMPUTADOR</text><rect x="25" y="55" width="630" height="330" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/><rect x="25" y="55" width="630" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="45" y="80" text-anchor="start" font-size="15" font-weight="bold" fill="#222">Sequencia de recuperacao BOOT</text><text x="50" y="140" text-anchor="start" font-size="15" font-weight="normal" fill="#222">1. Retirar USB; servos e bateria desconectados.</text><text x="50" y="183" text-anchor="start" font-size="15" font-weight="normal" fill="#222">2. Segurar o botao BOOT da placa.</text><text x="50" y="226" text-anchor="start" font-size="15" font-weight="normal" fill="#222">3. Conectar USB de dados mantendo BOOT.</text><text x="50" y="269" text-anchor="start" font-size="15" font-weight="normal" fill="#222">4. Soltar BOOT e procurar a porta COM.</text><text x="50" y="312" text-anchor="start" font-size="15" font-weight="normal" fill="#222">5. Gravar. Depois, pressionar RESET se necessario.</text><text x="340" y="418" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">Identificar BOOT pelas inscricoes; nao pelo lado do desenho.</text></svg>