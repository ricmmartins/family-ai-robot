<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Segoe UI, Arial, sans-serif"><rect width="680" height="440" fill="white"/><text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">LER O NOME NO MODULO, NAO ADIVINHAR PELA COR DO FIO</text><rect x="150" y="65" width="380" height="185" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><rect x="180" y="90" width="320" height="120" rx="6" fill="#1c2834" stroke="#666" stroke-width="1.5"/><text x="340" y="155" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">TELA OLED</text><text x="200" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">GND</text><rect x="195" y="250" width="10" height="40" rx="1" fill="#aaa" stroke="#777" stroke-width="1.5"/><text x="290" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">VCC</text><rect x="285" y="250" width="10" height="40" rx="1" fill="#aaa" stroke="#777" stroke-width="1.5"/><text x="380" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SCL</text><rect x="375" y="250" width="10" height="40" rx="1" fill="#aaa" stroke="#777" stroke-width="1.5"/><text x="470" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SDA</text><rect x="465" y="250" width="10" height="40" rx="1" fill="#aaa" stroke="#777" stroke-width="1.5"/><text x="340" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Ordem mostrada na foto do anuncio JAMHER enviado.</text><text x="340" y="363" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">Conferir as letras na SUA unidade; nao e foto da unidade recebida.</text><text x="340" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">VCC -&gt; 3V3 | SCL -&gt; D1 | SDA -&gt; D0 | GND -&gt; GND</text></svg>