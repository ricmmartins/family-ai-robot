width="395" height="100" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="275" y="110" text-anchor="start" font-size="12" font-weight="normal" fill="#222">Uma faixa colorida nao cria energia.</text><text x="275" y="135" text-anchor="start" font-size="12" font-weight="normal" fill="#222">Alguns barramentos sao interrompidos no meio.</text><text x="275" y="160" text-anchor="start" font-size="12" font-weight="normal" fill="#222">Os dois lados nao sao unidos automaticamente.</text><line x1="160" y1="211" x2="255" y2="211" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4"/><text x="273" y="217" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Possivel interrupcao: medir sem energia.</text><rect x="255" y="255" width="395" height="95" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="275" y="283" text-anchor="start" font-size="12" font-weight="normal" fill="#222">Usaremos A10-E10 como ponto GND.</text><text x="275" y="308" text-anchor="start" font-size="12" font-weight="normal" fill="#222">A11-E11 sera 3V3. A15-E15 sera 5V.</text><text x="275" y="333" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Nenhuma ponte entre essas tres linhas.</text></svg>