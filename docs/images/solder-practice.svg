<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Segoe UI, Arial, sans-serif"><rect width="680" height="440" fill="white"/><text x="340" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">TREINAR EM PLACA DE PRATICA, NAO NA XIAO</text><rect x="100" y="235" width="480" height="22" rx="1" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><rect x="326" y="115" width="18" height="220" rx="1" fill="#aaa" stroke="#777" stroke-width="1.5"/><path d="M 300 235 Q 315 230 326 207 L 344 207 Q 355 230 370 235 Z" fill="#aaa" stroke="#666"/><path d="M 70 95 L 110 75 L 326 226 L 307 235 Z" fill="#666" stroke="#333"/><line x1="535" y1="105" x2="350" y2="218" stroke="#999" stroke-width="5"/><text x="90" y="55" text-anchor="start" font-size="14" font-weight="bold" fill="#222">FERRO</text><text x="495" y="82" text-anchor="start" font-size="14" font-weight="bold" fill="#222">SOLDA</text><text x="340" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Aquecer pino E pad; alimentar a junta, nao so a ponta do ferro.</text><text x="340" y="404" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">Depois: tirar o fio de solda, retirar o ferro e deixar esfriar sem mover.</text></svg>