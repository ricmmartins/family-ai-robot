<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Segoe UI, Arial, sans-serif"><rect width="680" height="440" fill="white"/><rect x="20" y="50" width="280" height="300" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="160" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">EXEMPLO DE BOTAO 4 PINOS</text><circle cx="80" cy="145" r="9" fill="white" stroke="#666" stroke-width="2"/><circle cx="80" cy="270" r="9" fill="white" stroke="#666" stroke-width="2"/><circle cx="240" cy="145" r="9" fill="white" stroke="#666" stroke-width="2"/><circle cx="240" cy="270" r="9" fill="white" stroke="#666" stroke-width="2"/><line x1="80" y1="145" x2="80" y2="270" stroke="#333" stroke-width="4"/><line x1="240" y1="145" x2="240" y2="270" stroke="#333" stroke-width="4"/><line x1="80" y1="207" x2="135" y2="207" stroke="#333" stroke-width="3"/><line x1="135" y1="207" x2="215" y2="180" stroke="#333" stroke-width="3"/><line x1="215" y1="207" x2="240" y2="207" stroke="#333" stroke-width="3"/><text x="80" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">PAR A</text><text x="240" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">PAR B</text><text x="320" y="100" text-anchor="start" font-size="12" font-weight="normal" fill="#222">Confirmar os pares com multimetro.</text><text x="320" y="132" text-anchor="start" font-size="12" font-weight="normal" fill="#222">A orientacao real pode ser diferente.</text><text x="320" y="164" text-anchor="start" font-size="12" font-weight="bold" fill="#222">D7/GPIO44 -&gt; A20.</text><text x="320" y="196" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Um contato do PAR A -&gt; B20.</text><text x="320" y="228" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Um contato do PAR B -&gt; D10 (GND).</text><text x="320" y="260" text-anchor="start" font-size="12" font-weight="normal" fill="#222">Solto: A e B separados.</text><text x="320" y="292" text-anchor="start" font-size="12" font-weight="normal" fill="#222">Pressionado: A e B unidos.</text><text x="340" y="407" text-anchor="middle" font-size="12" font-weight="bold" fill="#a61b1b">Se nao souber identificar os pares, deixar o botao desconectado.</text></svg>