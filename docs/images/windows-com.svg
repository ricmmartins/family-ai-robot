<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Segoe UI, Arial, sans-serif"><rect width="680" height="440" fill="white"/><text x="340" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">DESENHO EXPLICATIVO: NAO E CAPTURA DO SEU COMPUTADOR</text><rect x="25" y="55" width="630" height="330" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/><rect x="25" y="55" width="630" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="45" y="80" text-anchor="start" font-size="15" font-weight="bold" fill="#222">Gerenciador de Dispositivos: exemplo</text><text x="65" y="135" text-anchor="start" font-size="15" font-weight="normal" fill="#222">Computador</text><text x="65" y="170" text-anchor="start" font-size="15" font-weight="normal" fill="#222">  &gt; Portas (COM e LPT)</text><text x="65" y="205" text-anchor="start" font-size="15" font-weight="bold" fill="#222">       USB Serial ... (COM7)</text><text x="65" y="240" text-anchor="start" font-size="15" font-weight="normal" fill="#222"></text><text x="65" y="275" text-anchor="start" font-size="15" font-weight="normal" fill="#222">O numero real pode ser diferente.</text><text x="65" y="310" text-anchor="start" font-size="15" font-weight="normal" fill="#222">Anote a porta que aparece ao conectar a placa.</text><text x="340" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">COM7 e exemplo. Nao copiar sem conferir a SUA porta.</text></svg>